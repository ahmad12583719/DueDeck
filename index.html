<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FocusFlow Task Manager</title><link rel="stylesheet" href="src/css/base.css"><link rel="stylesheet" href="src/css/themes.css"><link rel="stylesheet" href="src/css/layout.css"><link rel="stylesheet" href="src/css/components.css"></head><body><header class="topbar"><a class="brand" href="#">FocusFlow</a><div class="toolbar"><button data-action="toggle-theme" title="Toggle theme">◐</button><button data-action="export">Export</button><label class="button">Import<input id="import-file" type="file" accept="application/json" hidden></label><button data-action="new-task" class="primary">+ New task</button></div></header><main class="app"><aside class="sidebar"><div class="summary"><div class="ring" id="progress-ring"><span id="progress-value">0%</span></div><div><strong id="progress-label">Today</strong><small id="progress-count">0 of 0 complete</small></div></div><nav class="views"><button class="nav active" data-view="list">☷ List</button><button class="nav" data-view="calendar">▦ Calendar</button></nav><section><h3>Filters</h3><label class="search"><span>⌕</span><input id="search" placeholder="Search tasks…"></label><select id="status-filter"><option value="all">All status</option><option value="todo">To do</option><option value="doing">In progress</option><option value="done">Completed</option></select><select id="deadline-filter"><option value="all">All deadlines</option><option value="overdue">Overdue</option><option value="today">Today</option><option value="week">This week</option></select><div id="tag-filters" class="tag-filters"></div></section><section class="sidebar-foot"><button data-action="clear-completed">Clear completed</button><small>All data stays in your browser.</small></section></aside><section class="content"><div class="content-head"><div><h1 id="view-title">My tasks</h1><p id="view-subtitle">Plan your day, one task at a time.</p></div><div class="list-actions"><select id="sort"><option value="deadline">Deadline</option><option value="priority">Priority</option><option value="created">Created</option></select></div></div><div id="app-view"></div></section></main><dialog id="task-dialog"><form id="task-form"><header><h2 id="dialog-title">New task</h2><button type="button" data-dialog-cancel class="icon">×</button></header><input type="hidden" id="task-id"><label>Title<input id="task-title" required maxlength="120" placeholder="What needs doing?"></label><div class="grid2"><label>Deadline<input id="task-deadline" type="datetime-local"></label><label>Priority<select id="task-priority"><option value="low">Low</option><option value="medium" selected>Medium</option><option value="high">High</option></select></label></div><label>Description<textarea id="task-description" rows="5" placeholder="Add details, links, or an image URL…"></textarea><input id="task-image-url" type="url" placeholder="Image URL (optional)"><input id="task-image-file" type="file" accept="image/*"></label><div class="grid2"><label>Tags<input id="task-tags" placeholder="work, personal"></label><label>Color<input id="task-color" type="color" value="#6d5dfc"></label></div><label>Recurrence<select id="task-recurrence"><option value="">Does not repeat</option><option value="daily">Daily</option><option value="weekly">Weekly</option><option value="monthly">Monthly</option></select></label><label>Subtasks <input id="task-subtasks" placeholder="One item, another item"></label><footer><button type="button" data-dialog-cancel>Cancel</button><button type="submit" class="primary">Save task</button></footer></form></dialog><div id="toast" role="status"></div></body><script type="module" src="src/js/main.js"></script></html>
