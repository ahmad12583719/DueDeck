<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="DueDeck — your deadlines, all in one deck.">
    <title>DueDeck Task Manager</title>
    <link rel="stylesheet" href="src/css/base.css">
    <link rel="stylesheet" href="src/css/themes.css">
    <link rel="stylesheet" href="src/css/layout.css">
    <link rel="stylesheet" href="src/css/components.css">
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="#" aria-label="DueDeck home"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v11a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 17.5v-11Z"/><path d="m8 12 2.5 2.5L16 9"/></svg><span>DueDeck</span></a>
      <div class="toolbar">
        <button data-action="toggle-theme" title="Toggle theme" aria-label="Toggle theme"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 3v2m0 14v2M3 12h2m14 0h2m-3.4-6.6-1.4 1.4M7.8 16.2l-1.4 1.4m0-12.8 1.4 1.4m8.4 8.4 1.4 1.4M16 12a4 4 0 1 1-8 0 4 4 0 0 1 8 0Z"/></svg></button>
        <button data-action="export">Export</button>
        <label class="button">Import<input id="import-file" type="file" accept="application/json" hidden></label>
        <button data-action="new-task" class="primary"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>New task</span></button>
      </div>
    </header>
    <main class="app">
      <aside class="sidebar">
        <div class="summary"><div class="ring" id="progress-ring"><span id="progress-value">0%</span></div><div><strong id="progress-label">Today</strong><small id="progress-count">0 of 0 complete</small></div></div>
        <nav class="views" aria-label="Views"><button class="nav active" data-view="list"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 6h14M5 12h14M5 18h14"/></svg>List</button><button class="nav" data-view="calendar"><svg aria-hidden="true" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4m8-4v4M4 10h16"/></svg>Calendar</button></nav>
        <section><h3>Filters</h3><label class="search"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.3"/><path d="m16 16 4 4"/></svg><input id="search" placeholder="Search tasks…"></label><select id="status-filter"><option value="all">All status</option><option value="todo">To do</option><option value="doing">In progress</option><option value="done">Completed</option></select><select id="deadline-filter"><option value="all">All deadlines</option><option value="overdue">Overdue</option><option value="today">Today</option><option value="week">This week</option></select><div id="tag-filters" class="tag-filters"></div></section>
        <section class="sidebar-foot"><button data-action="clear-completed">Clear completed</button><small>All data stays in your browser.</small></section>
      </aside>
      <section class="content"><div class="content-head"><div><p class="eyebrow">Your deadlines, all in one deck.</p><h1 id="view-title">My tasks</h1><p id="view-subtitle">Plan your day, one task at a time.</p></div><div class="list-actions"><select id="sort"><option value="deadline">Deadline</option><option value="priority">Priority</option><option value="created">Created</option></select></div></div><div id="app-view"></div></section>
    </main>
    <dialog id="task-dialog"><form id="task-form"><header><h2 id="dialog-title">New task</h2><button type="button" data-dialog-cancel class="icon" aria-label="Close">×</button></header><input type="hidden" id="task-id"><label>Title<input id="task-title" required maxlength="120" placeholder="What needs doing?"></label><div class="grid2"><label>Deadline<input id="task-deadline" type="datetime-local"></label><label>Priority<select id="task-priority"><option value="low">Low</option><option value="medium" selected>Medium</option><option value="high">High</option></select></label></div><label>Description<textarea id="task-description" rows="5" placeholder="Add details, links, or an image URL…"></textarea><input id="task-image-url" type="url" placeholder="Image URL (optional)"><input id="task-image-file" type="file" accept="image/*"></label><div class="grid2"><label>Tags<input id="task-tags" placeholder="work, personal"></label><label>Color<input id="task-color" type="color" value="#5b62a8"></label></div><label>Recurrence<select id="task-recurrence"><option value="">Does not repeat</option><option value="daily">Daily</option><option value="weekly">Weekly</option><option value="monthly">Monthly</option></select></label><label>Subtasks<input id="task-subtasks" placeholder="One item, another item"></label><footer><button type="button" data-dialog-cancel>Cancel</button><button type="submit" class="primary">Save task</button></footer></form></dialog>
    <div id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="src/js/main.js"></script>
  </body>
</html>
